<svg style="max-width:860px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 286" fill="none" role="img">
  <title>Company records without semantics and with Contour</title>
  <defs>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="10" y="14" width="840" height="112" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text x="430" y="33" text-anchor="middle" fill="var(--accent)" font-size="11" font-weight="500" letter-spacing="1.3">FACTS WITHOUT SEMANTICS</text>

  <g fill="var(--panel)" stroke-width="1">
    <rect x="32" y="53" width="162" height="54" stroke="var(--rule)"/>
    <rect x="242" y="53" width="162" height="54" stroke="var(--rule)"/>
    <rect x="452" y="53" width="162" height="54" stroke="var(--rule)"/>
    <rect x="662" y="53" width="162" height="54" stroke="var(--accent)"/>
  </g>

  <g fill="var(--ink)" font-size="13" text-anchor="middle">
    <text x="113" y="71">
      <tspan x="113" dy="0">Databases,</tspan>
      <tspan x="113" dy="14">lakes and</tspan>
      <tspan x="113" dy="14">warehouses</tspan>
    </text>
    <text x="323" y="78">
      <tspan x="323" dy="0">Facts</tspan>
      <tspan x="323" dy="14">recorded</tspan>
    </text>
    <text x="533" y="78">
      <tspan x="533" dy="0">Meaning</tspan>
      <tspan x="533" dy="14">not encoded</tspan>
    </text>
  </g>
  <text x="743" y="78" fill="var(--accent)" font-size="13" text-anchor="middle">
    <tspan x="743" dy="0">Question waits</tspan>
    <tspan x="743" dy="14">or agent guesses</tspan>
  </text>

  <g stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-muted)">
    <path d="M204 80 H232"/>
    <path d="M414 80 H442"/>
    <path d="M624 80 H652"/>
  </g>

  <rect x="10" y="150" width="840" height="122" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text x="430" y="169" text-anchor="middle" fill="var(--accent)" font-size="11" font-weight="500" letter-spacing="1.3">WITH CONTOUR</text>

  <g fill="var(--panel)" stroke-width="1">
    <rect x="32" y="188" width="162" height="54" stroke="var(--rule)"/>
    <rect x="242" y="188" width="162" height="54" stroke="var(--accent)"/>
    <rect x="452" y="188" width="162" height="54" stroke="var(--rule)"/>
    <rect x="662" y="188" width="162" height="54" stroke="var(--accent)"/>
  </g>

  <g fill="var(--ink)" font-size="13" text-anchor="middle">
    <text x="113" y="213">
      <tspan x="113" dy="0">Existing</tspan>
      <tspan x="113" dy="14">records</tspan>
    </text>
    <text x="323" y="206">
      <tspan x="323" dy="0">Business</tspan>
      <tspan x="323" dy="14">semantics</tspan>
      <tspan x="323" dy="14">encoded</tspan>
    </text>
    <text x="533" y="213">
      <tspan x="533" dy="0">Logic + symbolic</tspan>
      <tspan x="533" dy="14">operations</tspan>
    </text>
  </g>
  <text x="743" y="206" fill="var(--accent)" font-size="13" text-anchor="middle">
    <tspan x="743" dy="0">Answer with</tspan>
    <tspan x="743" dy="14">meaning +</tspan>
    <tspan x="743" dy="14">context</tspan>
  </text>

  <g stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-muted)">
    <path d="M204 215 H232"/>
    <path d="M414 215 H442"/>
    <path d="M624 215 H652"/>
  </g>

</svg>
