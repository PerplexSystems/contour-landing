<!--
  Agent interface — hand-authored, replacing mcp-sequence.puml. One question
  answered with its derivation and provenance, and one refused because the plant
  model has no operation for it. Values illustrative.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 567" fill="none" style="max-width:860px" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How the assistant answers a reliability question through Contour over MCP, and how it refuses one the plant model does not describe</title><defs><marker id="sq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"></path></marker><marker id="sqa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"></path></marker></defs><path d="M80,40 L80,566" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"></path><rect x="10" y="0" width="140" height="40" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="80" y="17" text-anchor="middle" font-size="12" fill="var(--ink)">Reliability</text><text x="80" y="31" text-anchor="middle" font-size="12" fill="var(--ink)">engineer</text><path d="M250,40 L250,566" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"></path><rect x="180" y="0" width="140" height="40" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="250" y="24" text-anchor="middle" font-size="12" fill="var(--ink)">AI assistant</text><path d="M430,40 L430,566" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"></path><rect x="360" y="0" width="140" height="40" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="430" y="24" text-anchor="middle" font-size="12" fill="var(--ink)">Contour MCP</text><path d="M610,40 L610,566" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"></path><rect x="540" y="0" width="140" height="40" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="610" y="24" text-anchor="middle" font-size="12" fill="var(--ink)">Plant model</text><path d="M780,40 L780,566" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"></path><rect x="710" y="0" width="140" height="40" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="780" y="24" text-anchor="middle" font-size="12" fill="var(--ink)">Source systems</text><rect x="0.5" y="58" width="859" height="318" fill="none" stroke="var(--rule)"></rect><text x="12" y="76" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--accent)">The plant model describes the question</text><rect x="0.5" y="400" width="859" height="158" fill="none" stroke="var(--rule)"></rect><text x="12" y="418" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--accent)">The question falls outside the model</text><path d="M80,96 L249,96" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="165" y="89" text-anchor="middle" font-size="11.5" fill="var(--ink)">Can K-201 run to March?</text><path d="M250,128 L429,128" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="340" y="121" text-anchor="middle" style="font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace" fill="var(--ink)">system_reliability(K-201, 90 d)</text><path d="M430,160 L609,160" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="520" y="153" text-anchor="middle" font-size="11.5" fill="var(--ink)">applies the structure rules</text><path d="M610,192 L779,192" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="695" y="185" text-anchor="middle" font-size="11.5" fill="var(--ink)">reads history, read only</text><path d="M780,224 L611,224" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sq)"></path><text x="695" y="217" text-anchor="middle" font-size="11.5" fill="var(--ink)">work orders, tag records</text><path d="M610,256 L431,256" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sq)"></path><text x="520" y="249" text-anchor="middle" font-size="11.5" fill="var(--ink)">fits combined over the RBD</text><path d="M430,288 L251,288" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sqa)"></path><text x="340" y="281" text-anchor="middle" font-size="11.5" fill="var(--accent)">0.91 + derivation</text><path d="M430,320 L251,320" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sqa)"></path><text x="340" y="313" text-anchor="middle" font-size="11.5" fill="var(--accent)">+ provenance: the records read</text><path d="M250,352 L81,352" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sq)"></path><text x="165" y="345" text-anchor="middle" font-size="11.5" fill="var(--ink)">an answer you can check</text><path d="M80,438 L249,438" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="165" y="431" text-anchor="middle" font-size="11.5" fill="var(--ink)">Why did P-101 fail in 2019?</text><path d="M250,470 L429,470" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sq)"></path><text x="340" y="463" text-anchor="middle" font-size="11.5" fill="var(--ink)">looks for an operation</text><path d="M430,502 L251,502" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sqa)"></path><text x="340" y="495" text-anchor="middle" font-size="11.5" fill="var(--accent)">none covers this</text><path d="M250,534 L81,534" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sqa)"></path><text x="165" y="527" text-anchor="middle" font-size="11.5" fill="var(--accent)">says it does not know</text></svg>