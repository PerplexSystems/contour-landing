<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 224" fill="none" style="max-width:860px" role="img"><title>Three blocks in series against two pumps in parallel that share one supply</title><defs><marker id="rbA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/></marker></defs><text x="0" y="14" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--muted)">Series · all must work</text><rect x="0" y="58" width="110" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="55" y="79" text-anchor="middle" font-size="11.5" fill="var(--ink)">Feed pump</text><text x="55" y="93" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.95</text><path d="M110,82 L137,82" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#rbA)"/><rect x="138" y="58" width="110" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="193" y="79" text-anchor="middle" font-size="11.5" fill="var(--ink)">Heat exchanger</text><text x="193" y="93" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.98</text><path d="M248,82 L275,82" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#rbA)"/><rect x="276" y="58" width="110" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="331" y="79" text-anchor="middle" font-size="11.5" fill="var(--ink)">Compressor</text><text x="331" y="93" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.97</text><text x="0" y="146" font-size="13" fill="var(--ink)">0.95 × 0.98 × 0.97 = 0.90</text><text x="0" y="166" font-size="12" fill="var(--muted)">Lower than any single block.</text><text x="452" y="14" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--muted)">Parallel · one of two</text><path d="M452,98 L470,98 M470,52 L470,144 M470,52 L486,52 M470,144 L486,144 M596,52 L612,52 M596,144 L612,144 M612,52 L612,144" stroke="var(--muted)" stroke-width="1" fill="none"/><rect x="486" y="28" width="110" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="541" y="49" text-anchor="middle" font-size="11.5" fill="var(--ink)">P-101A</text><text x="541" y="63" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.90</text><rect x="486" y="120" width="110" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="541" y="141" text-anchor="middle" font-size="11.5" fill="var(--ink)">P-101B</text><text x="541" y="155" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.90</text><path d="M612,98 L661,98" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#rbA)"/><rect x="662" y="74" width="140" height="48" fill="var(--panel)" stroke="var(--accent)" stroke-width="1"/><text x="732" y="95" text-anchor="middle" font-size="11.5" fill="var(--accent)">Shared supply</text><text x="732" y="109" text-anchor="middle" font-size="11" fill="var(--muted)">R 0.97</text><path d="M802,98 L858,98" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#rbA)"/><text x="452" y="196" font-size="13" fill="var(--ink)">1 − 0.10² = 0.99, then × 0.97 = 0.96</text><text x="452" y="216" font-size="12" fill="var(--muted)">Redundant only as far as the supply they share.</text></svg>
