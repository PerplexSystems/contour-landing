<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" fill="none" style="max-width:860px" role="img"><title>The same reliability study done by hand and with Contour</title><defs><marker id="slA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/></marker></defs><rect x="0.5" y="0.5" width="859" height="84" fill="none" stroke="var(--rule)"/><text x="14" y="46" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--accent)">By hand</text><rect x="136" y="20" width="103.66666666666667" height="44" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="187.83333333333334" y="39" text-anchor="middle" font-size="11.5" fill="var(--ink)">Export work</text><text x="187.83333333333334" y="53" text-anchor="middle" font-size="11.5" fill="var(--ink)">orders</text><path d="M239.66666666666669,42 L256.6666666666667,42" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#slA)"/><rect x="257.6666666666667" y="20" width="103.66666666666667" height="44" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="309.5" y="39" text-anchor="middle" font-size="11.5" fill="var(--ink)">Clean failure</text><text x="309.5" y="53" text-anchor="middle" font-size="11.5" fill="var(--ink)">codes</text><path d="M361.33333333333337,42 L378.33333333333337,42" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#slA)"/><rect x="379.33333333333337" y="20" width="103.66666666666667" height="44" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="431.1666666666667" y="39" text-anchor="middle" font-size="11.5" fill="var(--ink)">Match tags</text><text x="431.1666666666667" y="53" text-anchor="middle" font-size="11.5" fill="var(--ink)">to equipment</text><path d="M483.00000000000006,42 L500.00000000000006,42" fill="none" stroke="var(--muted)" stroke-width="1" marker-