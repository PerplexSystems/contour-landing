<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 352" fill="none" style="max-width:860px" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The same reliability question answered by an assistant writing its own queries, and through Contour's checked operations over MCP</title><defs><marker id="tp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"></path></marker><marker id="tpa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"></path></marker></defs><rect x="0.5" y="0.5" width="859" height="116" fill="none" stroke="var(--rule)"></rect><text x="16" y="22" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--muted)">An assistant pointed at the data</text><rect x="16" y="44" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="115" y="69" text-anchor="middle" font-size="12" fill="var(--ink)">Can compressor K-201</text><text x="115" y="83" text-anchor="middle" font-size="12" fill="var(--ink)">run to the March outage?</text><rect x="226" y="44" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="325" y="69" text-anchor="middle" font-size="12" fill="var(--ink)">Writes its own queries</text><text x="325" y="83" text-anchor="middle" font-size="12" fill="var(--ink)">over historian and SAP</text><rect x="436" y="44" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="535" y="69" text-anchor="middle" font-size="12" fill="var(--ink)">Returns a figure</text><text x="535" y="83" text-anchor="middle" font-size="12" fill="var(--ink)">and a paragraph</text><rect x="646" y="44" width="198" height="56" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"></rect><text x="745" y="69" text-anchor="middle" font-size="12" fill="var(--muted)">Nothing to check</text><text x="745" y="83" text-anchor="middle" font-size="12" fill="var(--muted)">the figure against</text><path d="M214,72 L225,72" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path><path d="M424,72 L435,72" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path><path d="M634,72 L645,72" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path><rect x="0.5" y="136.5" width="859" height="214" fill="none" stroke="var(--rule)"></rect><text x="16" y="158" text-anchor="start" style="font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase" fill="var(--accent)">Through Contour, over MCP</text><rect x="16" y="180" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="115" y="205" text-anchor="middle" font-size="12" fill="var(--ink)">Can compressor K-201</text><text x="115" y="219" text-anchor="middle" font-size="12" fill="var(--ink)">run to the March outage?</text><rect x="226" y="180" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="325" y="198" text-anchor="middle" font-size="12" fill="var(--ink)">Calls an operation</text><text x="325" y="212" text-anchor="middle" font-size="12" fill="var(--ink)">the model defines</text><text x="325" y="226" text-anchor="middle" style="font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace" fill="var(--accent)">system_reliability</text><rect x="436" y="180" width="198" height="56" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="535" y="205" text-anchor="middle" font-size="12" fill="var(--ink)">Each step checked</text><text x="535" y="219" text-anchor="middle" font-size="12" fill="var(--ink)">against the plant model</text><rect x="646" y="180" width="198" height="56" fill="var(--panel)" stroke="var(--accent)" stroke-width="1"></rect><text x="745" y="205" text-anchor="middle" font-size="12" fill="var(--ink)">0.91, with the</text><text x="745" y="219" text-anchor="middle" font-size="12" fill="var(--ink)">derivation behind it</text><path d="M214,208 L225,208" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path><path d="M424,208 L435,208" fill="none" stroke="var(--accent)" stroke-width="1" marker-end="url(#tpa)"></path><path d="M634,208 L645,208" fill="none" stroke="var(--accent)" stroke-width="1" marker-end="url(#tpa)"></path><path d="M325,236 L325,294" fill="none" stroke="var(--muted)" stroke-width="1"></path><path d="M325,294 L435,294" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path><text x="333" y="258" text-anchor="start" font-size="11" fill="var(--muted)">or</text><rect x="436" y="270" width="198" height="48" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"></rect><text x="535" y="291" text-anchor="middle" font-size="12" fill="var(--muted)">No operation</text><text x="535" y="305" text-anchor="middle" font-size="12" fill="var(--muted)">covers the question</text><rect x="646" y="270" width="198" height="48" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"></rect><text x="745" y="298" text-anchor="middle" font-size="12" fill="var(--ink)">Says it does not know</text><path d="M634,294 L645,294" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#tp)"></path></svg>